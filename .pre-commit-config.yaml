# Pre-commit hooks (ADR-097)\nrepos:\n  - repo: local\n    hooks:\n      - id: justfile-verify\n        name: justfile-verify\n        entry: just justfile-verify\n        language: system\n        pass_filenames: false\n  - repo: https://github.com/pre-commit/pre-commit-hooks\n    rev: v5.0.0\n    hooks:\n      - id: no-commit-to-branch\n        args: ['--branch=main']\n      - id: check-yaml\n